<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to Smart Notice Board Admin Dashboard">
  <title>Login — Smart Notice Board</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    
    .auth-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
      color: white;
    }
    
    .auth-header h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      font-weight: 700;
    }
    
    .auth-header p {
      font-size: 1rem;
      opacity: 0.9;
    }
    
    .auth-panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 40px 36px;
    }
    
    .auth-panel h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .auth-panel .auth-subtitle {
      font-size: 0.95rem;
      color: #718096;
      margin-bottom: 32px;
      text-align: center;
    }
    
    .auth-panel .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    
    .auth-panel .input-wrapper label {
      display: block;
      margin-bottom: 8px;
      color: #4a5568;
      font-weight: 500;
      font-size: 0.9rem;
    }
    
    .auth-panel .input-wrapper input {
      width: 100%;
      padding: 12px 40px 12px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.3s;
      background: white;
    }
    
    .auth-panel .input-wrapper input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      outline: none;
    }
    
    .auth-panel .input-wrapper .field-icon {
      position: absolute;
      right: 14px;
      top: 42px;
      color: #cbd5e0;
      font-size: 0.9rem;
      pointer-events: none;
    }

    .auth-panel .input-wrapper .toggle-password {
      position: absolute;
      right: 14px;
      top: 42px;
      color: #718096;
      font-size: 0.9rem;
      cursor: pointer;
      transition: color 0.3s;
      z-index: 10;
    }

    .auth-panel .input-wrapper .toggle-password:hover {
      color: #667eea;
    }
    
    .auth-panel .btn-primary {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px;
      font-size: 0.95rem;
      margin-top: 10px;
      background: #667eea;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .auth-panel .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }
    
    .form-check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 15px 0;
    }
    
    .form-check input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    .form-check label {
      font-size: 0.9rem;
      color: #718096;
      cursor: pointer;
      user-select: none;
    }
    
    .demo-credentials {
      margin-top: 20px;
      padding: 12px;
      background: #ebf4ff;
      border-radius: 8px;
      text-align: center;
    }
    
    .demo-credentials p {
      font-size: 0.85rem;
      color: #3182ce;
      font-weight: 500;
      margin: 0;
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.9rem;
      color: #718096;
    }

    .auth-footer a {
      color: #667eea;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s;
    }

    .auth-footer a:hover {
      color: #5568d3;
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .auth-header h1 {
        font-size: 1.5rem;
      }
      
      .auth-panel {
        padding: 30px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Header -->
    <div class="auth-header">
      <h1>
        <i class="fas fa-clipboard-list"></i>
        SMART NOTICE BOARD
      </h1>
      <p>Manage your college notices efficiently</p>
    </div>

    <!-- Login Panel -->
    <div class="auth-panel">
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Login to access your dashboard</p>

      <form id="loginForm" autocomplete="off">
        <div class="input-wrapper">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="Enter your email" required>
          <i class="fas fa-envelope field-icon"></i>
        </div>

        <div class="input-wrapper">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
          <i class="fas fa-eye toggle-password" id="toggleLoginPassword"></i>
        </div>

        <div class="form-check">
          <input type="checkbox" id="rememberMe" checked>
          <label for="rememberMe">Remember me</label>
        </div>

        <button type="submit" class="btn btn-primary">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>

      <!-- Demo credentials -->
      <div class="demo-credentials">
        <p>
          <i class="fas fa-info-circle"></i> Demo: admin@noticeboard.com / admin123
        </p>
      </div>

      <!-- Registration Link -->
      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create new account</a>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="js/app-backend.js"></script>
  <script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('toggleLoginPassword');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', function() {
        const passwordInput = document.getElementById('loginPassword');
        const icon = this;
        
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          passwordInput.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      });
    }
  </script>
</body>
</html>
