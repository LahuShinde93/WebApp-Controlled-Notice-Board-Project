<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to Smart Notice Board Admin Dashboard">
  <title>Login — Smart Notice Board</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }
    .auth-panel {
      background: #fff;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      padding: 36px 32px;
    }
    .auth-panel h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 6px;
    }
    .auth-panel .auth-subtitle {
      font-size: 0.88rem;
      color: var(--gray-500);
      margin-bottom: 28px;
    }
    .auth-panel .form-group label {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .auth-panel .form-control {
      padding-right: 40px;
    }
    .auth-panel .input-wrapper {
      position: relative;
    }
    .auth-panel .input-wrapper .field-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      font-size: 0.9rem;
    }
    .auth-panel .btn-primary {
      width: 100%;
      justify-content: center;
      padding: 13px;
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .auth-panel .auth-footer {
      margin-top: 20px;
    }
    @media (max-width: 900px) {
      .auth-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- ─── TOP NAVBAR ─── -->
  <nav class="navbar" id="topNavbar">
    <div class="navbar-brand">
      <button class="menu-toggle" aria-label="Toggle Menu">
        <i class="fas fa-bars"></i>
      </button>
      <div class="brand-icon">
        <i class="fas fa-clipboard-list"></i>
      </div>
      <h1>SMART <span>NOTICE BOARD</span></h1>
    </div>
    <div class="navbar-right">
      <span class="navbar-welcome">Welcome, <strong>Admin</strong> <i class="fas fa-caret-down"></i></span>
      <div class="navbar-profile">
        <div class="profile-avatar" title="Admin">A</div>
        <button class="btn-logout" onclick="logout()" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ─── LEFT SIDEBAR ─── -->
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link" id="navDashboard">
        <i class="fas fa-home"></i> Dashboard
      </a>
      <a href="create-notice.html" class="sidebar-link" id="navCreateNotice">
        <i class="fas fa-plus-square"></i> Create Notice
      </a>
      <a href="manage-notices.html" class="sidebar-link" id="navManageNotices">
        <i class="fas fa-th-list"></i> Manage Notices
      </a>
      <a href="categories.html" class="sidebar-link" id="navCategories">
        <i class="fas fa-folder"></i> Categories
      </a>
      <div class="sidebar-divider"></div>
      <a href="#" class="sidebar-link" id="navSettings">
        <i class="fas fa-cog"></i> Settings
      </a>
    </nav>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ─── MAIN CONTENT ─── -->
  <main class="main-content">

    <div class="auth-grid fade-in">

      <!-- ─── Registration Panel (Left) ─── -->
      <div class="auth-panel">
        <h2>Admin Registration</h2>
        <p class="auth-subtitle">Create an admin account to manage the notice board.</p>

        <form id="registerForm" autocomplete="off">
          <div class="form-group">
            <label for="regName">Full Name</label>
            <div class="input-wrapper">
              <input type="text" id="regName" class="form-control" placeholder="Enter your full name" required>
              <i class="fas fa-user field-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="regEmail">Email</label>
            <div class="input-wrapper">
              <input type="email" id="regEmail" class="form-control" placeholder="Enter your email" required>
              <i class="fas fa-envelope field-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="regPassword">Password</label>
            <div class="input-wrapper">
              <input type="password" id="regPassword" class="form-control" placeholder="Create a password" required minlength="6">
              <i class="fas fa-lock field-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="regConfirm">Confirm Password</label>
            <div class="input-wrapper">
              <input type="password" id="regConfirm" class="form-control" placeholder="Confirm your password" required>
              <i class="fas fa-shield-alt field-icon"></i>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="registerBtn">
            <i class="fas fa-user-plus"></i> Register
          </button>
        </form>
      </div>

      <!-- ─── Login Panel (Right) ─── -->
      <div class="auth-panel">
        <h2>Admin Login</h2>
        <p class="auth-subtitle">Login to manage the notice board.</p>

        <form id="loginForm" autocomplete="off">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <div class="input-wrapper">
              <input type="email" id="loginEmail" class="form-control" placeholder="admin@noticeboard.com" required>
              <i class="fas fa-envelope field-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="input-wrapper">
              <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
              <i class="fas fa-lock field-icon"></i>
            </div>
          </div>

          <div class="form-check">
            <input type="checkbox" id="rememberMe" checked>
            <label for="rememberMe">Remember me</label>
          </div>

          <button type="submit" class="btn btn-primary" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
        </form>

        <!-- Demo credentials -->
        <div style="margin-top:20px;padding:12px;background:var(--primary-50);border-radius:8px;text-align:center;">
          <p style="font-size:0.8rem;color:var(--primary-700);font-weight:500;">
            <i class="fas fa-info-circle"></i> Demo: admin@noticeboard.com / admin123
          </p>
        </div>
      </div>

    </div>

  </main>

  <!-- JavaScript -->
  <script src="js/app-backend.js"></script>
</body>
</html>
