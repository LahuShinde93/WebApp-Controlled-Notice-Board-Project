<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage notice categories on Smart Notice Board">
  <title>Categories — Smart Notice Board</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ─── TOP NAVBAR ─── -->
  <nav class="navbar" id="topNavbar">
    <div class="navbar-brand">
      <button class="menu-toggle" aria-label="Toggle Menu">
        <i class="fas fa-bars"></i>
      </button>
      <div class="brand-icon">
        <i class="fas fa-clipboard-list"></i>
      </div>
      <h1>SMART <span>NOTICE BOARD</span></h1>
    </div>
    <div class="navbar-right">
      <span class="navbar-welcome">Welcome, <strong>Admin</strong> <i class="fas fa-caret-down"></i></span>
      <div class="navbar-profile">
        <div class="profile-avatar" title="Admin">A</div>
        <button class="btn-logout" onclick="logout()" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ─── LEFT SIDEBAR ─── -->
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link" id="navDashboard">
        <i class="fas fa-home"></i> Dashboard
      </a>
      <a href="create-notice.html" class="sidebar-link" id="navCreateNotice">
        <i class="fas fa-plus-square"></i> Create Notice
      </a>
      <a href="manage-notices.html" class="sidebar-link" id="navManageNotices">
        <i class="fas fa-th-list"></i> Manage Notices
      </a>
      <a href="categories.html" class="sidebar-link active" id="navCategories">
        <i class="fas fa-folder"></i> Categories
      </a>
      <div class="sidebar-divider"></div>
      <a href="#" class="sidebar-link" id="navSettings">
        <i class="fas fa-cog"></i> Settings
      </a>
    </nav>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ─── MAIN CONTENT ─── -->
  <main class="main-content">

    <!-- Page Header -->
    <div class="page-header fade-in">
      <h2><i class="fas fa-folder-open" style="color:var(--primary-500);margin-right:10px;"></i>Categories</h2>
      <p>Organize your notices with categories.</p>
    </div>

    <!-- Stats row for categories -->
    <div class="stats-grid" style="margin-bottom:24px;">
      <div class="stat-card blue fade-in fade-in-delay-1">
        <div class="stat-icon">
          <i class="fas fa-layer-group"></i>
        </div>
        <div class="stat-info">
          <h3>Total Categories</h3>
          <div class="stat-number" id="catTotalCount">5</div>
        </div>
      </div>
      <div class="stat-card green fade-in fade-in-delay-2">
        <div class="stat-icon">
          <i class="fas fa-clipboard-check"></i>
        </div>
        <div class="stat-info">
          <h3>Total Notices</h3>
          <div class="stat-number" id="catNoticeCount">8</div>
        </div>
      </div>
    </div>

    <!-- Categories List Card -->
    <div class="card fade-in">
      <div class="card-header">
        <h3><i class="fas fa-tags"></i> All Categories</h3>
      </div>
      <div class="card-body">

        <!-- Category List -->
        <div class="category-list" id="categoryList">
          <!-- Populated by JS -->
        </div>

        <!-- Add Category Form -->
        <form id="addCategoryForm" class="add-category-form">
          <input type="text" id="newCategoryName" class="form-control" placeholder="Enter new category name..." required>
          <button type="submit" class="btn btn-primary" id="addCategoryBtn">
            <i class="fas fa-plus"></i> Add
          </button>
        </form>

      </div>
    </div>

  </main>

  <!-- JavaScript -->
  <script src="js/app-backend.js"></script>
  <script>
    // Update category page stats
    document.addEventListener('DOMContentLoaded', async () => {
      // Check authentication first
      if (!checkAuth()) return;

      const catTotal = document.getElementById('catTotalCount');
      const catNotice = document.getElementById('catNoticeCount');
      
      try {
        const catResponse = await apiCall('/categories');
        const noticeResponse = await apiCall('/notices');
        
        if (catTotal && catResponse.status === 'SUCCESS') {
          catTotal.textContent = catResponse.data.length;
        }
        if (catNotice && noticeResponse.status === 'SUCCESS') {
          catNotice.textContent = noticeResponse.data.length;
        }
      } catch (error) {
        console.error('Failed to load stats:', error);
      }
    });
  </script>
</body>
</html>
