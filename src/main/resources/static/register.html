<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register for Smart Notice Board Admin Dashboard">
  <title>Register — Smart Notice Board</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .auth-container {
      width: 100%;
      max-width: 480px;
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
      color: white;
    }
    
    .auth-header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    
    .auth-header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }
    
    .auth-panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 40px 36px;
    }
    
    .auth-panel h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 8px;
      text-align: center;
    }
    
    .auth-panel .auth-subtitle {
      font-size: 0.95rem;
      color: var(--gray-500);
      margin-bottom: 32px;
      text-align: center;
    }
    
    .auth-panel .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    
    .auth-panel .input-wrapper label {
      display: block;
      margin-bottom: 8px;
      color: var(--gray-700);
      font-weight: 500;
      font-size: 0.9rem;
    }
    
    .auth-panel .input-wrapper input {
      width: 100%;
      padding: 12px 40px 12px 12px;
      border: 2px solid var(--gray-200);
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.3s;
    }
    
    .auth-panel .input-wrapper input:focus {
      border-color: var(--primary-500);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      outline: none;
    }
    
    .auth-panel .input-wrapper .field-icon {
      position: absolute;
      right: 14px;
      top: 42px;
      color: var(--gray-400);
      font-size: 0.9rem;
    }
    
    .auth-panel .btn-primary {
      width: 100%;
      justify-content: center;
      padding: 13px;
      font-size: 0.95rem;
      margin-top: 10px;
      background: var(--primary-600);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .auth-panel .btn-primary:hover {
      background: var(--primary-700);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--gray-600);
    }

    .auth-footer a {
      color: var(--primary-600);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s;
    }

    .auth-footer a:hover {
      color: var(--primary-700);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Header -->
    <div class="auth-header">
      <h1>
        <i class="fas fa-clipboard-list"></i>
        SMART NOTICE BOARD
      </h1>
      <p>Manage your college notices efficiently</p>
    </div>

    <!-- Registration Panel -->
    <div class="auth-panel">
      <h2>Create Account</h2>
      <p class="auth-subtitle">Register to manage the notice board</p>

      <form id="registerForm" autocomplete="off">
        <div class="input-wrapper">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="Enter your full name" required>
          <i class="fas fa-user field-icon"></i>
        </div>

        <div class="input-wrapper">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" placeholder="Enter your email" required>
          <i class="fas fa-envelope field-icon"></i>
        </div>

        <div class="input-wrapper">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="Create a password" required minlength="6">
          <i class="fas fa-lock field-icon"></i>
        </div>

        <div class="input-wrapper">
          <label for="regConfirm">Confirm Password</label>
          <input type="password" id="regConfirm" placeholder="Confirm your password" required>
          <i class="fas fa-shield-alt field-icon"></i>
        </div>

        <button type="submit" class="btn btn-primary">
          <i class="fas fa-user-plus"></i> Register
        </button>
      </form>

      <!-- Login Link -->
      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="js/app-backend.js"></script>
</body>
</html>
