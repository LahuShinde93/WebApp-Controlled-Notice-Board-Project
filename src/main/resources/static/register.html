<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register for Smart Notice Board Admin Dashboard">
  <title>Register — Smart Notice Board</title>
  <!-- Redirect to login page which has both forms -->
  <meta http-equiv="refresh" content="0;url=login.html">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ─── TOP NAVBAR ─── -->
  <nav class="navbar" id="topNavbar">
    <div class="navbar-brand">
      <button class="menu-toggle" aria-label="Toggle Menu">
        <i class="fas fa-bars"></i>
      </button>
      <div class="brand-icon">
        <i class="fas fa-clipboard-list"></i>
      </div>
      <h1>SMART <span>NOTICE BOARD</span></h1>
    </div>
    <div class="navbar-right">
      <span class="navbar-welcome">Welcome, <strong>Admin</strong> <i class="fas fa-caret-down"></i></span>
      <div class="navbar-profile">
        <div class="profile-avatar" title="Admin">A</div>
        <button class="btn-logout" onclick="logout()" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ─── LEFT SIDEBAR ─── -->
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link" id="navDashboard">
        <i class="fas fa-home"></i> Dashboard
      </a>
      <a href="create-notice.html" class="sidebar-link" id="navCreateNotice">
        <i class="fas fa-plus-square"></i> Create Notice
      </a>
      <a href="manage-notices.html" class="sidebar-link" id="navManageNotices">
        <i class="fas fa-th-list"></i> Manage Notices
      </a>
      <a href="categories.html" class="sidebar-link" id="navCategories">
        <i class="fas fa-folder"></i> Categories
      </a>
      <div class="sidebar-divider"></div>
      <a href="#" class="sidebar-link" id="navSettings">
        <i class="fas fa-cog"></i> Settings
      </a>
    </nav>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ─── MAIN CONTENT ─── -->
  <main class="main-content">

    <div class="card fade-in" style="max-width:560px;margin:40px auto;">
      <div class="card-body" style="padding:40px;text-align:center;">
        <div style="width:70px;height:70px;background:linear-gradient(135deg,var(--primary-600),var(--primary-800));border-radius:18px;display:inline-flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;margin-bottom:20px;">
          <i class="fas fa-user-plus"></i>
        </div>
        <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:8px;">Create Account</h2>
        <p style="color:var(--gray-500);margin-bottom:28px;">Register a new admin account</p>

        <form id="registerForm" autocomplete="off">
          <div class="form-group" style="text-align:left;">
            <label for="regName"><i class="fas fa-user"></i> Full Name</label>
            <input type="text" id="regName" class="form-control" placeholder="Enter your full name" required>
          </div>

          <div class="form-group" style="text-align:left;">
            <label for="regEmail"><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" id="regEmail" class="form-control" placeholder="Enter your email" required>
          </div>

          <div class="form-group" style="text-align:left;">
            <label for="regPassword"><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Create a password (min 6 chars)" required minlength="6">
          </div>

          <div class="form-group" style="text-align:left;">
            <label for="regConfirm"><i class="fas fa-shield-alt"></i> Confirm Password</label>
            <input type="password" id="regConfirm" class="form-control" placeholder="Confirm your password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" id="registerBtn" style="width:100%;justify-content:center;">
            <i class="fas fa-user-check"></i> Create Account
          </button>
        </form>

        <div class="auth-footer" style="margin-top:24px;">
          Already have an account? <a href="login.html" style="color:var(--primary-600);font-weight:600;">Sign In</a>
        </div>
      </div>
    </div>

  </main>

  <!-- JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
