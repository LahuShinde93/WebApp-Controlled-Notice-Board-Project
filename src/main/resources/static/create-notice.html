<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a new notice on Smart Notice Board">
  <title>Create Notice — Smart Notice Board</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ─── TOP NAVBAR ─── -->
  <nav class="navbar" id="topNavbar">
    <div class="navbar-brand">
      <button class="menu-toggle" aria-label="Toggle Menu">
        <i class="fas fa-bars"></i>
      </button>
      <div class="brand-icon">
        <i class="fas fa-clipboard-list"></i>
      </div>
      <h1>SMART <span>NOTICE BOARD</span></h1>
    </div>
    <div class="navbar-right">
      <span class="navbar-welcome">Welcome, <strong>Admin</strong> <i class="fas fa-caret-down"></i></span>
      <div class="navbar-profile">
        <div class="profile-avatar" title="Admin">A</div>
        <button class="btn-logout" onclick="logout()" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ─── LEFT SIDEBAR ─── -->
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link" id="navDashboard">
        <i class="fas fa-home"></i> Dashboard
      </a>
      <a href="create-notice.html" class="sidebar-link active" id="navCreateNotice">
        <i class="fas fa-plus-square"></i> Create Notice
      </a>
      <a href="manage-notices.html" class="sidebar-link" id="navManageNotices">
        <i class="fas fa-th-list"></i> Manage Notices
      </a>
      <a href="categories.html" class="sidebar-link" id="navCategories">
        <i class="fas fa-folder"></i> Categories
      </a>
      <div class="sidebar-divider"></div>
      <a href="#" class="sidebar-link" id="navSettings">
        <i class="fas fa-cog"></i> Settings
      </a>
    </nav>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ─── MAIN CONTENT ─── -->
  <main class="main-content">

    <!-- Hero Banner with Illustration -->
    <div class="welcome-banner fade-in" style="margin-bottom:28px;">
      <div class="welcome-text">
        <h2>Create Notice</h2>
        <p>Fill out the form below to create a new notice.</p>
      </div>
      <div class="welcome-illustration" style="display:flex;gap:16px;align-items:center;">
        <i class="fas fa-bullhorn" style="font-size:3rem;opacity:0.9;"></i>
        <i class="fas fa-laptop" style="font-size:2.5rem;opacity:0.7;"></i>
        <i class="fas fa-user-edit" style="font-size:2.8rem;opacity:0.8;"></i>
      </div>
    </div>

    <!-- Section Title -->
    <div class="page-header fade-in" style="margin-bottom:20px;">
      <h2><i class="fas fa-th-list" style="color:var(--primary-500);margin-right:10px;"></i>Manage Notices</h2>
    </div>

    <!-- Create Notice Form Card -->
    <div class="card fade-in">
      <div class="card-body">
        <form id="createNoticeForm">

          <!-- Title -->
          <div class="form-group">
            <label for="noticeTitle">Title:</label>
            <input type="text" id="noticeTitle" class="form-control" placeholder="Enter notice title" required>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label for="noticeDescription">Description:</label>
            <textarea id="noticeDescription" class="form-control" placeholder="Write notice description here..." required style="min-height:100px;"></textarea>
          </div>

          <!-- Category, Priority, Status (3 columns) -->
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;">
            <div class="form-group">
              <label for="noticeCategory">Category:</label>
              <select id="noticeCategory" class="form-control" required>
                <option value="">Select Category</option>
                <!-- Populated by JS -->
              </select>
            </div>
            <div class="form-group">
              <label for="noticePriority">Priority:</label>
              <select id="noticePriority" class="form-control" required>
                <option value="">Select Priority</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
            <div class="form-group">
              <label for="noticeStatus">Status:</label>
              <select id="noticeStatus" class="form-control" required>
                <option value="">Select Status</option>
                <option value="Active">Active</option>
                <option value="Draft">Draft</option>
                <option value="Expired">Expired</option>
              </select>
            </div>
          </div>

          <!-- Expiry Date -->
          <div class="form-group">
            <label for="noticeExpiry">Expiry Date:</label>
            <input type="date" id="noticeExpiry" class="form-control">
          </div>

          <!-- Submit Button -->
          <div style="display:flex;gap:12px;margin-top:24px;">
            <button type="submit" class="btn btn-primary btn-lg" id="submitNoticeBtn">
              <i class="fas fa-paper-plane"></i> Create Notice
            </button>
            <button type="button" class="btn btn-outline btn-lg" id="resetFormBtn">
              <i class="fas fa-undo"></i> Reset
            </button>
          </div>

        </form>
      </div>
    </div>

  </main>

  <!-- JavaScript -->
  <script src="js/app-backend.js"></script>
</body>
</html>
